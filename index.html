<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=dashboard/" />
  <title>Nawin Hotel Management</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --ink: #17202a;
      --muted: #687386;
      --line: #dfe5ec;
      --brand: #136f63;
    }

    * { box-sizing: border-box; }

    body {
      align-items: center;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }

    main {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      max-width: 460px;
      padding: 28px;
      width: 100%;
    }

    h1 { margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 18px; }

    a {
      align-items: center;
      background: var(--brand);
      border-radius: 8px;
      color: #fff;
      display: flex;
      justify-content: center;
      min-height: 44px;
      text-decoration: none;
      width: 100%;
    }

    a + a {
      background: #101820;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <main>
    <h1>นาวิน โฮเทล</h1>
    <p>กำลังพาไปหน้า Dashboard...</p>
    <a href="dashboard/">เปิด Dashboard</a>
    <a href="guest-app/">เปิด Guest App</a>
  </main>
</body>
</html>
